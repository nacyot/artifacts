<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;background:#faf9f7;color:#1c1c1c;
    font-family:"Noto Sans CJK KR","Noto Sans KR",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    position:relative;overflow:hidden}
  .bar{position:absolute;left:0;top:0;bottom:0;width:12px;background:#7a4a3a}
  .wrap{padding:64px 72px;height:100%;display:flex;flex-direction:column}
  .kicker{font-size:22px;font-weight:700;letter-spacing:.06em;color:#7a4a3a;margin-bottom:26px}
  h1{font-size:54px;font-weight:800;line-height:1.28;letter-spacing:-.02em;max-width:18em}
  .sub{font-size:26px;color:#5b5b57;margin-top:20px;line-height:1.45;max-width:22em}
  .stats{margin-top:36px;display:flex;gap:14px;flex-wrap:wrap}
  .chip{background:#efeee7;border:1px solid #e4e2da;border-radius:10px;padding:12px 18px;font-size:20px;font-weight:600;color:#3a3a36}
  .chip b{color:#1c1c1c;font-weight:800}
  .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between}
  .brand{font-size:22px;font-weight:700;color:#1c1c1c}
  .cmd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;color:#7a4a3a;background:#efeee7;border:1px solid #e4e2da;border-radius:10px;padding:12px 16px}
</style></head><body>
<div class="bar"></div>
<div class="wrap">
  <div class="kicker">Ecowitt WS90 / Zigbee2MQTT</div>
  <h1>지그비 기상 센서에서<br>바람과 UV와 강우 값이<br>오지 않았다</h1>
  <div class="sub">낡은 쪽은 기기가 아니라<br>그 값을 받아 적는 소프트웨어였다.</div>
  <div class="stats">
    <div class="chip">내보내는 값 <b>6 to 22</b></div>
    <div class="chip">해석기 <b>z2m 2.7.0</b></div>
  </div>
  <div class="foot">
    <div class="brand">nacyot / artifacts</div>
    <div class="cmd">cluster 0xFC01 0xFC02 0xFC03</div>
  </div>
</div>
</body></html>
