<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;background:#faf9f7;color:#1c1c1c;
    font-family:"Noto Sans CJK KR","Noto Sans KR",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    position:relative;overflow:hidden}
  .bar{position:absolute;left:0;top:0;bottom:0;width:12px;background:#46537a}
  .wrap{padding:58px 84px 46px;height:100%;display:flex;flex-direction:column}
  .kicker{font-size:21px;font-weight:600;letter-spacing:.14em;color:#46537a;margin-bottom:22px}
  h1{font-size:54px;font-weight:800;line-height:1.24;letter-spacing:-.02em}
  .sub{font-size:24px;color:#5b5b57;margin-top:18px;line-height:1.5;max-width:30em}
  .stage{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between}
  .stat .num{font-size:64px;font-weight:800;letter-spacing:-.02em;color:#46537a;
    font-variant-numeric:tabular-nums;line-height:1}
  .stat .num small{font-size:30px;font-weight:700;letter-spacing:0;margin-left:6px}
  .stat .cap{font-size:20px;color:#5b5b57;margin-top:10px}
  .foot{display:flex;justify-content:space-between;align-items:baseline;
    border-top:1px solid #e4e2da;margin-top:26px;padding-top:18px}
  .brand{font-size:21px;font-weight:700}
  .model{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;color:#5b5b57}
</style></head><body>
<div class="bar"></div>
<div class="wrap">
  <div class="kicker">DGX SPARK ×4, 200G FABRIC</div>
  <h1>DGX Spark 4대를<br>스위치 하나로 묶기</h1>
  <div class="sub">400G 브레이크아웃 DAC 두 가닥으로 만든 200G 풀메시. 모든 노드쌍이 직결과 같은 속도로 통한다.</div>
  <div class="stage">
    <div class="stat">
      <div class="num">195.7<small>Gb/s</small></div>
      <div class="cap">모든 노드쌍, 스위치 손실 없음</div>
    </div>
    <svg width="430" height="176" viewBox="0 0 430 180" fill="none">
      <rect x="140" y="70" width="150" height="44" fill="#f3f2ec" stroke="#1c1c1c" stroke-width="2"/>
      <text x="215" y="97" text-anchor="middle" font-family="Noto Sans CJK KR,sans-serif" font-size="17" font-weight="700" fill="#1c1c1c">CRS812</text>
      <rect x="20" y="8" width="92" height="34" stroke="#8a887f" stroke-width="1.6"/>
      <rect x="318" y="8" width="92" height="34" stroke="#8a887f" stroke-width="1.6"/>
      <rect x="20" y="140" width="92" height="34" stroke="#8a887f" stroke-width="1.6"/>
      <rect x="318" y="140" width="92" height="34" stroke="#8a887f" stroke-width="1.6"/>
      <text x="66" y="30" text-anchor="middle" font-size="14" fill="#5b5b57" font-family="Noto Sans CJK KR,sans-serif">노드 1</text>
      <text x="364" y="30" text-anchor="middle" font-size="14" fill="#5b5b57" font-family="Noto Sans CJK KR,sans-serif">노드 2</text>
      <text x="66" y="162" text-anchor="middle" font-size="14" fill="#5b5b57" font-family="Noto Sans CJK KR,sans-serif">노드 3</text>
      <text x="364" y="162" text-anchor="middle" font-size="14" fill="#5b5b57" font-family="Noto Sans CJK KR,sans-serif">노드 4</text>
      <path d="M112 30 L170 70" stroke="#46537a" stroke-width="3.5"/>
      <path d="M318 30 L260 70" stroke="#46537a" stroke-width="3.5"/>
      <path d="M112 152 L170 114" stroke="#46537a" stroke-width="3.5"/>
      <path d="M318 152 L260 114" stroke="#46537a" stroke-width="3.5"/>
    </svg>
  </div>
  <div class="foot">
    <div class="brand">nacyot / artifacts</div>
    <div class="model">CRS812-8DS-2DQ-2DDQ, Q2Q56-400G-CU1 ×2</div>
  </div>
</div>
</body></html>
