<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;background:#faf9f7;color:#1c1c1c;
    font-family:"Noto Sans CJK KR","Noto Sans KR",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    position:relative;overflow:hidden}
  .bar{position:absolute;left:0;top:0;bottom:0;width:12px;background:#2f5d50}
  .wrap{padding:60px 68px;height:100%;display:flex;flex-direction:column}
  .kicker{font-size:22px;font-weight:700;letter-spacing:.06em;color:#2f5d50;margin-bottom:24px}
  h1{font-size:54px;font-weight:800;line-height:1.26;letter-spacing:-.02em;max-width:18em}
  .sub{font-size:25px;color:#5b5b57;margin-top:18px;line-height:1.45;max-width:25em}
  .stats{margin-top:30px;display:flex;gap:13px;flex-wrap:wrap}
  .chip{background:#efeee7;border:1px solid #e4e2da;border-radius:10px;padding:11px 17px;font-size:20px;font-weight:600;color:#3a3a36}
  .chip b{color:#2f5d50;font-weight:800}
  .chip.alt b{color:#b03a1f}
  .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between}
  .brand{font-size:22px;font-weight:700;color:#1c1c1c}
  .cmd{font-size:19px;color:#2f5d50;background:#efeee7;border:1px solid #e4e2da;border-radius:10px;padding:11px 15px}
</style></head><body>
<div class="bar"></div>
<div class="wrap">
  <div class="kicker">개인이 컴퓨터를 여러 대 묶는다는 것</div>
  <h1>값싼 PC를 묶어 슈퍼컴퓨터를<br>만들던 일이 다시 벌어지고 있다</h1>
  <div class="sub">1994년 베오울프가 그랬고, 지금 DGX Spark를<br>두 대씩 사서 묶는 사람들이 그렇다.</div>
  <div class="stats">
    <div class="chip">1994년 <b>16대</b>에 4만 달러</div>
    <div class="chip alt">2026년 <b>2대</b>에 지능 지수 52</div>
    <div class="chip">많게는 <b>8대</b></div>
  </div>
  <div class="foot">
    <div class="brand">nacyot / artifacts</div>
    <div class="cmd">Beowulf, 1994 → DGX Spark, 2026</div>
  </div>
</div>
</body></html>
