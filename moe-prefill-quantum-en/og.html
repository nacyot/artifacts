<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;background:#faf9f7;color:#1c1c1c;
    font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;
    position:relative;overflow:hidden}
  .bar{position:absolute;left:0;top:0;bottom:0;width:12px;background:#b03a1f}
  .wrap{padding:60px 68px;height:100%;display:flex;flex-direction:column}
  .kicker{font-size:22px;font-weight:700;letter-spacing:.06em;color:#b03a1f;margin-bottom:24px}
  h1{font-size:56px;font-weight:800;line-height:1.16;letter-spacing:-.022em;max-width:17em}
  .sub{font-size:25px;color:#5b5b57;margin-top:20px;line-height:1.42;max-width:26em}
  .stats{margin-top:32px;display:flex;gap:13px;flex-wrap:wrap}
  .chip{background:#efeee7;border:1px solid #e4e2da;border-radius:10px;padding:11px 17px;font-size:20px;font-weight:600;color:#3a3a36}
  .chip b{color:#b03a1f;font-weight:800}
  .chip.alt b{color:#0f6ea3}
  .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between}
  .brand{font-size:22px;font-weight:700;color:#1c1c1c}
  .cmd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;color:#b03a1f;background:#efeee7;border:1px solid #e4e2da;border-radius:10px;padding:11px 15px}
</style></head><body>
<div class="bar"></div>
<div class="wrap">
  <div class="kicker">antirez ds4 / DeepSeek V4 Flash</div>
  <h1>One default was halving<br>prefill in ds4-server</h1>
  <div class="sub">It reads 95% of the experts, then does<br>a three-row matmul against each of them.</div>
  <div class="stats">
    <div class="chip">synthetic probe <b>2.31x</b></div>
    <div class="chip alt">real agents <b>2.20x</b></div>
    <div class="chip">only while requests <b>overlap</b></div>
  </div>
  <div class="foot">
    <div class="brand">nacyot / artifacts</div>
    <div class="cmd">--mixed-prefill-quantum 2048</div>
  </div>
</div>
</body></html>
