<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;background:#faf9f7;color:#1c1c1c;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    position:relative;overflow:hidden}
  .bar{position:absolute;left:0;top:0;bottom:0;width:12px;background:#7a4a3a}
  .wrap{padding:64px 72px;height:100%;display:flex;flex-direction:column}
  .kicker{font-size:22px;font-weight:700;letter-spacing:.06em;color:#7a4a3a;margin-bottom:26px}
  h1{font-size:54px;font-weight:800;line-height:1.24;letter-spacing:-.02em;max-width:19em}
  .sub{font-size:25px;color:#5b5b57;margin-top:20px;line-height:1.45;max-width:26em}
  .stats{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
  .chip{background:#efeee7;border:1px solid #e4e2da;border-radius:10px;padding:12px 18px;font-size:20px;font-weight:600;color:#3a3a36}
  .chip b{color:#1c1c1c;font-weight:800}
  .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between}
  .brand{font-size:22px;font-weight:700;color:#1c1c1c}
  .cmd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;color:#7a4a3a;background:#efeee7;border:1px solid #e4e2da;border-radius:10px;padding:12px 16px}
</style></head><body>
<div class="bar"></div>
<div class="wrap">
  <div class="kicker">DGX SPARK (GB10) · vLLM</div>
  <h1>Why vLLM pegs four CPU cores<br>at 100% on the DGX Spark</h1>
  <div class="sub">It's a spin-wait that never gets to sleep — traced with py-spy to one default, and it's what overheats the SoC.</div>
  <div class="stats">
    <div class="chip">CPU <b>333% → 89%</b></div>
    <div class="chip">SoC <b>−11°C</b></div>
    <div class="chip">perf loss <b>zero</b></div>
    <div class="chip">fix <b>one line</b></div>
  </div>
  <div class="foot">
    <div class="brand">nacyot / artifacts</div>
    <div class="cmd">busy_loop_s = 0.002</div>
  </div>
</div>
</body></html>
