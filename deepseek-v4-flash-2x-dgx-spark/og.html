<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;background:#faf9f7;color:#1c1c1c;
    font-family:"Noto Sans CJK KR","Noto Sans KR",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    position:relative;overflow:hidden}
  .bar{position:absolute;left:0;top:0;bottom:0;width:12px;background:#46537a}
  .wrap{padding:64px 72px;height:100%;display:flex;flex-direction:column}
  .kicker{font-size:22px;font-weight:700;letter-spacing:.06em;color:#46537a;margin-bottom:26px}
  h1{font-size:52px;font-weight:800;line-height:1.28;letter-spacing:-.02em;max-width:18em}
  .sub{font-size:25px;color:#5b5b57;margin-top:20px;line-height:1.45;max-width:23em}
  .stats{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
  .chip{background:#efeee7;border:1px solid #e4e2da;border-radius:10px;padding:12px 18px;font-size:20px;font-weight:600;color:#3a3a36}
  .chip b{color:#1c1c1c;font-weight:800}
  .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between}
  .brand{font-size:22px;font-weight:700;color:#1c1c1c}
  .cmd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;color:#46537a;background:#efeee7;border:1px solid #e4e2da;border-radius:10px;padding:12px 16px}
</style></head><body>
<div class="bar"></div>
<div class="wrap">
  <div class="kicker">DGX Spark ×2 · 실측</div>
  <h1>DeepSeek V4 Flash 0731<br>원본 FP8 돌리기</h1>
  <div class="sub">166.9GB 원본을 vLLM TP=2로. 디코드는 컨텍스트도 클럭도 타지 않고, 전성비는 최저 클럭이 두 배 앞선다.</div>
  <div class="stats">
    <div class="chip">컨텍스트 <b>512k 통과</b></div>
    <div class="chip">디코드 <b>56 → 46 tok/s</b></div>
    <div class="chip">집계 <b>207 tok/s</b></div>
    <div class="chip">벤치 <b>95케이스</b></div>
  </div>
  <div class="foot">
    <div class="brand">nacyot / artifacts</div>
    <div class="cmd">TP=2 · DSpark k=5 · 1M ctx</div>
  </div>
</div>
</body></html>
