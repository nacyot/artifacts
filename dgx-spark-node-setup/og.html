<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;background:#faf9f7;color:#1c1c1c;
    font-family:"Noto Sans CJK KR","Noto Sans KR",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    position:relative;overflow:hidden}
  .bar{position:absolute;left:0;top:0;bottom:0;width:12px;background:#7a4a3a}
  .wrap{padding:64px 72px;height:100%;display:flex;flex-direction:column}
  .kicker{font-size:22px;font-weight:700;letter-spacing:.06em;color:#7a4a3a;margin-bottom:26px}
  h1{font-size:50px;font-weight:800;line-height:1.28;letter-spacing:-.02em;max-width:19em}
  .sub{font-size:25px;color:#5b5b57;margin-top:20px;line-height:1.45;max-width:30em}
  .stats{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
  .chip{background:#efeee7;border:1px solid #e4e2da;border-radius:10px;padding:12px 18px;font-size:20px;font-weight:600;color:#3a3a36}
  .chip b{color:#1c1c1c;font-weight:800}
  .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between}
  .brand{font-size:22px;font-weight:700;color:#1c1c1c}
  .cmd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;color:#7a4a3a;background:#efeee7;border:1px solid #e4e2da;border-radius:10px;padding:12px 16px}
</style></head><body>
<div class="bar"></div>
<div class="wrap">
  <div class="kicker">DGX Spark · GB10 · 초기 셋업</div>
  <h1>DGX Spark 한 대를<br>추론 서버로 길들이기</h1>
  <div class="sub">공장 상태에서 베이스라인까지 — 서버 모드·드라이버 595·GPU/CPU 클럭 상한·PD 펌웨어·보안·네트워크, 그리고 밟은 함정.</div>
  <div class="stats">
    <div class="chip">재부팅 <b>1회</b></div>
    <div class="chip">유휴 가용 <b>119 GiB</b></div>
    <div class="chip">CPU 상한 이유 <b>vLLM 스핀</b></div>
    <div class="chip">PD FW <b>0x1 → 0x516</b></div>
  </div>
  <div class="foot">
    <div class="brand">nacyot / artifacts</div>
    <div class="cmd">apt-mark manual → -s purge → autoremove</div>
  </div>
</div>
</body></html>
